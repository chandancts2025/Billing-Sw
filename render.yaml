services:
  - type: web
    name: billease-pro-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /swagger/index.html
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false # Set this in Render Dashboard to your Azure SQL / Cloud SQL connection string
      - key: Database__AutoMigrate
        value: "true"
      - key: Cors__AllowedOrigins__0
        value: "http://localhost:4200"
      - key: Cors__AllowedOrigins__1
        value: "https://billease-pro.vercel.app"
